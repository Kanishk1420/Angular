<!-- Passing Color From TS File to HTML -->
 <div [style.backgroundColor]="backgroundcolor" class="page-container">
     <h1 [style.color]="color" [style.fontSize.px]="fontSize">Dynamic Styling</h1>
     <button (click)="IncrementCounter()" [style.fontSize.px]="fontSize" [style.color]="color">Increase</button>
     <button (click)="DecrementCounter()" [style.fontSize.px]="fontSize" [style.color]="color">Decrease</button>
     <p [style.fontSize.px]="fontSize" [style.color]="color">This will get big in Size</p>
     <p [style.fontSize.px]="fontSize" [style.color]="color">This will get small in Size</p>
     <button (click)="Toogle()">{{text}}</button>
</div>
<!-- In the CSS style binding, the property must be written in camelCase as [style.backgroundColor] (with a capital C). Angular will not recognize style.backgroundcolor. -->
