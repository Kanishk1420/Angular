<div class="p-6">

  <!-- Header -->
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold text-gray-800">Employee Directory</h1>
    <button
      class="bg-amber-400 text-black rounded px-4 py-2 font-semibold text-sm cursor-pointer hover:bg-amber-500"
      routerLink="/add">
      + Add New
    </button>
  </div>

  <!-- Table -->
  <div class="border border-gray-200 rounded-xl overflow-hidden shadow-sm">
    <table class="w-full text-sm text-gray-700">

      <!-- Head -->
      <thead class="bg-amber-400 text-black">
        <tr>
          <th class="px-4 py-3 text-left">Sr.No</th>
          <th class="px-4 py-3 text-left">Name</th>
          <th class="px-4 py-3 text-left">Status</th>
          <th class="px-4 py-3 text-left">Actions</th>
        </tr>
      </thead>

      <!-- Body -->
      <tbody>
        @for (employee of employees; track $index) {
          <tr class="border-t border-gray-100 hover:bg-gray-50">
            <td class="px-4 py-3">{{ employee.id }}</td>
            <td class="px-4 py-3 font-medium">{{ employee.name }}</td>
            <td class="px-4 py-3">
              <span
                [class]="employee.status
                  ? ' text-green-600 px-3 py-1 rounded-full text-xs font-semibold'
                  : ' text-red-500 px-3 py-1 rounded-full text-xs font-semibold'"
              >
                {{ employee.status ? 'Active' : 'Inactive' }}
              </span>
            </td>
            <td class="px-4 py-3">
              <div class="flex gap-2">
                <button
                  [routerLink]="['/display', employee.id]"
                  class="bg-amber-400 text-black rounded px-3 py-1 text-xs font-semibold cursor-pointer hover:bg-amber-500">
                  View
                </button>
                <button
                  [routerLink]="['/edit', employee.id]"
                  class="bg-gray-100 text-gray-700 rounded px-3 py-1 text-xs font-semibold cursor-pointer hover:bg-gray-200">
                  Edit
                </button>
              </div>
            </td>
          </tr>
        }
      </tbody>

    </table>
  </div>

</div>
