<div class="max-w-md mx-auto mt-10 p-6 ">
  <!-- Header -->
  <h1 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">To-Do List</h1>

  <!-- Input Form Group -->
  <div class="flex gap-2 mb-6">
    <input
      type="text"
      [(ngModel)]="task"
      placeholder="Enter New Task"
      class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-400 text-sm"
    />
    <button
      (click)="addTask()"
      class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg transition-colors duration-200 shadow-sm cursor-pointer"
    >
      Add Task
    </button>
  </div>

  <!-- Tasks Container -->
  <div class="space-y-3">
    @for (task of taskList; track task.id) {
      <div
        class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200 hover:shadow-sm transition-shadow duration-150"
      >
        <div class="flex items-center gap-3">
          <span class="text-xs font-semibold text-gray-400 bg-gray-200 px-2 py-0.5 rounded">
            {{ task.id }}.
          </span>
          <p class="text-sm font-medium text-gray-700">
            {{ task.task }}
          </p>
        </div>

        <!-- Actions -->
        <button
          (click)="deleteTask()"
          class="px-2.5 py-1.5 text-xs font-medium text-red-600 hover:text-white hover:bg-red-600 rounded-md border border-red-200 hover:border-red-600 transition-all duration-150 curos"
        >
          Delete Task
        </button>
      </div>
    } @empty {
      <p class="text-center text-sm text-gray-400 py-4">No tasks yet. Add one above!</p>
    }
  </div>
</div>
