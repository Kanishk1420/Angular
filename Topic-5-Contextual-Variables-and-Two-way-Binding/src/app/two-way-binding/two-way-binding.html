<div class="w-full max-w-sm">
  <h1 class="text-2xl text-red-300">Two Way Binding</h1>
  <label class="block text-sm font-medium text-gray-700 mb-1" for="username">Username</label>
  <input
    [(ngModel)]="name"
    type="text"
    placeholder="Enter your Username"
    class="w-full px-4 py-2 text-sm border border-gray-300 rounded-lg bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm"
  />
  <h1 class="text-2xl text-black font-sans mt-4">{{ name }}</h1>
</div>
